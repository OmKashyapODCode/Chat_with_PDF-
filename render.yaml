# render.yaml — Render.com Infrastructure as Code
# Defines both the API server and background worker in one file.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── 1. Express API (Web Service) ─────────────────────────────────────────────
  - type: web
    name: pdf-chat-api
    runtime: node
    rootDir: server
    buildCommand: npm install -g pnpm && pnpm install
    startCommand: pnpm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_API_KEY
        sync: false          # Enter this manually in Render dashboard
      - key: CLOUDAMQP_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false          # Set this to your Vercel frontend URL

  # ── 2. Background Worker ──────────────────────────────────────────────────────
  - type: worker
    name: pdf-chat-worker
    runtime: node
    rootDir: server
    buildCommand: npm install -g pnpm && pnpm install
    startCommand: pnpm start:worker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_API_KEY
        sync: false
      - key: CLOUDAMQP_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
